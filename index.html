<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Rock Paper Scissors</h1>

        <p class="subtitle">Choose your own move and challenge the computer!</p>

        <!--Score board-->
        <div class="scoreboard">
            <div class="player-score">
                <h2>You</h2>
                <p id="player-score">0</p>
            </div>
            <div class="computer-score">
                <h2>Computer</h2>
                <p id="computer-score">0</p>
            </div>
        </div>
        <!--Game choices-->
        <div class="choices">
            <button class="choice" id="rock" data-choice="rock">Rock</button>
            <button class="choice" id="paper" data-choice="paper">Paper</button>
            <button class="choice" id="scissors" data-choice="scissors">Scissors</button>

        </div>
        <!--Result display-->
        <div class="result">
            <p id="user-choice">Your choice</p>
            <p id="computer-choice">Computer's choice</p>
            <p id="winner">Choose your move!</p>
        </div>

        <!--play again button-->
        <button id="play-again" class="play-again">Play Again</button>

    </main>
    
</body>
</html>
